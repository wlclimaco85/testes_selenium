[pytest]
addopts = -ra --strict-markers
testpaths = tests
markers =
    smoke: valida abertura/navegacao sem alterar dados
    cadastro: CRUD de cadastros base (faixa, raca, tipo_exame)
    entrada: fluxo de entrada de animais via NF
    reproducao: IATF, monta, diagnostico de gestacao, parto
    apontamento: apontamento de pecuaria e reversao
    saida: venda e saida de animais
    mutating: altera dados no ambiente (requer DHARA_E2E_MUTATING=1)
    visual: captura evidencia visual (screenshot)
    p1: demandas P1 (estoque/venda duplicada) - baseline xfail + aceitacao
    p2: demandas P2 (flags TGF e Servico/Veiculo) - baseline xfail + aceitacao
    p3: demandas P3 (rateio, apontamento individual, peso, reproducao, leitor de brinco) - baseline xfail + aceitacao
    p4: demandas P4 (campos bloqueados, idade minima matriz, bloqueio animais projeto, botoes orfaos) - baseline xfail + aceitacao
